backend:
  name: github
  repo: quang3215/minh-duc
  branch: main

# Đường dẫn trang web & logo
site_url: https://thumuacapdonggiacao.com
display_url: https://thumuacapdonggiacao.com
logo_url: https://thumuacapdonggiacao.com/logo.svg

# Thư mục lưu ảnh khi upload từ CMS
media_folder: public/img/tin-tuc
public_folder: /img/tin-tuc

# Ngôn ngữ giao diện
locale: vi

collections:

  # ─── CẤU HÌNH WEBSITE & BẢNG GIÁ ───────────────────────────
  - name: "settings"
    label: "⚙️ Cấu Hình Website"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "Thông tin liên hệ & Cơ bản"
        file: "src/data/settings.json"
        description: "Chỉnh sửa số điện thoại, email, địa chỉ, mã theo dõi..."
        fields:
          - {label: "Tên Công Ty", name: "siteName", widget: "string"}
          - {label: "Hotline (để gọi, VD: 0936350118)", name: "hotline", widget: "string"}
          - {label: "Hotline (hiển thị, VD: 0936.350.118)", name: "hotlineDisplay", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Địa chỉ", name: "address", widget: "string"}
          - {label: "Giờ làm việc", name: "workingHours", widget: "string"}
          - {label: "Zalo Link (VD: https://zalo.me/0936350118)", name: "zaloLink", widget: "string"}
          - {label: "Mã theo dõi thẻ HEAD (GA4, GTM...)", name: "headScripts", widget: "text", required: false, hint: "Dán mã <script> Google Analytics, GTM... Chèn vào <head>."}
          - {label: "Mã theo dõi thẻ BODY (Chống click ảo, Zalo Chat...)", name: "bodyScripts", widget: "text", required: false, hint: "Dán mã script đặt ở cuối <body>."}

      - name: "pricing"
        label: "💰 Bảng Giá Thu Mua"
        file: "src/data/pricing.json"
        description: "Cập nhật bảng giá thu mua các loại phế liệu, dây cáp điện, kim loại..."
        fields:
          - label: "Danh sách bảng giá"
            name: "prices"
            widget: "list"
            fields:
              - {label: "Danh mục (VD: Phế Liệu Đồng, Inox...)", name: "category", widget: "string"}
              - {label: "Tên loại phế liệu / thiết bị", name: "name", widget: "string"}
              - {label: "Đơn giá (VD: 225.000 - 255.000 hoặc Liên Hệ)", name: "price", widget: "string"}

  # ─── QUẢN LÝ BÀI VIẾT TIN TỨC ────────────────────────────────────
  - name: "tin-tuc"
    label: "📰 Tin Tức & Bài Viết"
    label_singular: "Bài viết"
    folder: "src/content/tin-tuc"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "/tin-tuc/{{slug}}/"
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: ["pubDate", "title"]
    fields:
      - label: "Tiêu đề bài viết"
        name: "title"
        widget: "string"
        hint: "VD: Bảng Giá Thu Mua Cáp Đồng Hôm Nay 2026"

      - label: "Mô tả SEO (Meta Description)"
        name: "description"
        widget: "text"
        hint: "Tóm tắt ngắn 140–160 ký tự cho kết quả tìm kiếm Google"

      - label: "Ngày đăng"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: ""

      - label: "Ngày cập nhật (Tùy chọn)"
        name: "updatedDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: false

      - label: "Ảnh đại diện"
        name: "image"
        widget: "image"
        required: false
        hint: "Ảnh hiển thị đầu bài và khi chia sẻ Zalo / Facebook"

      - label: "Mô tả ảnh (Alt Text)"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Mô tả bức ảnh cho Google (tối ưu SEO hình ảnh)"

      - label: "Tags (Từ khóa phân loại)"
        name: "tags"
        widget: "list"
        required: false
        hint: "VD: cáp đồng, phế liệu, bảng giá"

      - label: "Từ khóa SEO (Meta Keywords)"
        name: "keywords"
        widget: "string"
        required: false
        hint: "Các từ khóa cách nhau bằng dấu phẩy"

      - label: "Canonical URL (Tùy chọn)"
        name: "canonical"
        widget: "string"
        required: false

      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"
        hint: "Soạn thảo nội dung bài viết với trình soạn thảo trực quan (Heading, In đậm, Chèn ảnh, Link...)"
